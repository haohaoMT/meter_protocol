<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DLT645/698 电能表通信协议解码器</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>DLT645/698 电能表通信协议解码器</h1>
            <p class="subtitle">支持 DLT645-1997、DLT645-2007、DLT698.45-2017 协议</p>
        </header>

        <main>
            <div class="layout">
                <!-- 输入区域 -->
                <section class="input-section">
                    <h2>输入十六进制数据</h2>
                    <textarea 
                        id="hexInput" 
                        placeholder="请输入十六进制数据，例如：68 AA AA AA AA AA AA 68..."
                        rows="8"
                    ></textarea>
                    
                    <div class="input-actions">
                        <button id="parseBtn" class="btn btn-primary">解析</button>
                        <button id="clearBtn" class="btn btn-secondary">清空</button>
                        <button id="configRateBtn" class="btn btn-secondary">配置变比</button>
                    </div>

                    <div class="example-selector">
                        <label for="exampleSelect">示例数据：</label>
                        <select id="exampleSelect">
                            <option value="">选择示例...</option>
                            <option value="dlt645-1997">DLT645-1997 示例</option>
                            <option value="dlt645-2007">DLT645-2007 示例</option>
                            <option value="dlt698">DLT698.45-2017 示例</option>
                        </select>
                    </div>

                    <div id="inputError" class="error-message"></div>
                </section>

                <!-- 结果展示区域 -->
                <section class="result-section">
                    <h2>解析结果</h2>
                    
                    <div id="loadingIndicator" class="loading" style="display: none;">
                        <div class="spinner"></div>
                        <span>解析中...</span>
                    </div>

                    <div id="resultContainer" class="result-container">
                        <p class="placeholder">请输入数据并点击"解析"按钮</p>
                    </div>

                    <div class="result-actions" style="display: none;">
                        <button id="exportBtn" class="btn btn-secondary">导出 JSON</button>
                    </div>
                </section>
            </div>

            <!-- 历史记录区域 -->
            <aside class="history-section">
                <div class="history-header">
                    <h3>查询历史</h3>
                    <button id="clearHistoryBtn" class="btn btn-small">清除历史</button>
                </div>
                <ul id="historyList" class="history-list">
                    <li class="history-empty">暂无历史记录</li>
                </ul>
            </aside>
        </main>

        <footer>
            <p>&copy; 2026 DLT645/698 电能表通信协议解码器</p>
        </footer>
    </div>

    <!-- CT/PT 变比配置对话框 -->
    <div id="rateConfigDialog" class="dialog-overlay" style="display: none;">
        <div class="dialog-container">
            <div class="dialog-header">
                <h3>CT/PT 变比配置</h3>
                <button id="closeDialogBtn" class="dialog-close-btn" aria-label="关闭对话框">&times;</button>
            </div>
            
            <div class="dialog-body">
                <!-- 配置输入表单 -->
                <div class="config-form">
                    <div class="form-group">
                        <label for="deviceAddressInput">设备地址 <span class="required">*</span></label>
                        <input 
                            type="text" 
                            id="deviceAddressInput" 
                            placeholder="12位十六进制字符，例如：012400042520"
                            maxlength="12"
                            class="form-input"
                        />
                        <div id="deviceAddressError" class="input-error"></div>
                    </div>
                    
                    <div class="form-group">
                        <label for="ctRatioInput">CT 变比 <span class="required">*</span></label>
                        <input 
                            type="text" 
                            id="ctRatioInput" 
                            placeholder="例如：350/1"
                            class="form-input"
                        />
                        <div id="ctRatioError" class="input-error"></div>
                    </div>
                    
                    <div class="form-group">
                        <label for="ptRatioInput">PT 变比 <span class="required">*</span></label>
                        <input 
                            type="text" 
                            id="ptRatioInput" 
                            placeholder="例如：2400/1"
                            class="form-input"
                        />
                        <div id="ptRatioError" class="input-error"></div>
                    </div>
                    
                    <div class="form-actions">
                        <button id="saveRateBtn" class="btn btn-primary">保存配置</button>
                        <button id="cancelRateBtn" class="btn btn-secondary">取消</button>
                    </div>
                </div>
                
                <!-- 已保存的配置列表 -->
                <div class="config-list-section">
                    <h4>已保存的配置</h4>
                    <div id="configListContainer" class="config-list">
                        <p class="config-empty">暂无配置</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- JavaScript 模块 -->
    <!-- 加载工具模块 -->
    <script src="js/utils.js"></script>
    
    <!-- 加载存储模块 -->
    <script src="js/storage.js"></script>
    
    <!-- 加载变比配置模块 -->
    <script src="js/rate-config.js"></script>
    
    <!-- 加载解码器适配器 -->
    <script src="js/decoder-adapter.js"></script>
    
    <!-- 加载应用控制器 -->
    <script src="js/app.js"></script>
</body>
</html>
